include:
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: e4c4a9105025ee4d3ba6d97733850134dc5dac37
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: e4c4a9105025ee4d3ba6d97733850134dc5dac37
    file: /.gitlab/ci/renovate.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: e4c4a9105025ee4d3ba6d97733850134dc5dac37
    file: /.gitlab/ci/cancel-mr-pipelines.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - $NAPGRAM_GITLAB_DEFAULT_RUNNER_TAG
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure

stages:
  - prepare
  - build
  - validate
  - test
  - quality
  - package
  - release-build
  - release-publish
  - notify
  - maintenance

variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  MAGISK_CANCEL_OLDER_MR_PIPELINES: "true"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fast
  MAGISK_CI_TOOLKIT_REF: "e4c4a9105025ee4d3ba6d97733850134dc5dac37"

  # Default runner for non-container node jobs (build/test/typecheck/sdk:publish/
  # ui:build/etc.). Pinned to arm64 to stop depending on the amd64 runner for
  # architecture-agnostic work. Container builds keep their per-arch tags below.
  NAPGRAM_GITLAB_DEFAULT_RUNNER_TAG: "magisk-arm64-linux"
  NAPGRAM_GITLAB_LINUX_AMD64_RUNNER_TAG: "magisk-amd64-linux"
  NAPGRAM_GITLAB_LINUX_ARM64_RUNNER_TAG: "magisk-arm64-linux"
  NAPGRAM_BUN_IMAGE: "oven/bun:1.4-alpine"

  # Override this when the UI mirror uses another namespace or host.
  NAPGRAM_UI_REPOSITORY: "https://gitlab.com/magisk3171/napgram-ecosystem/napgram-ui-dist.git"
  NAPGRAM_UI_REF: "c8721fcb341e6172c79ded410988234642f8a99a"
  NAPGRAM_UI_RELEASE_REF: ""
  NAPGRAM_DOCKER_PUBLISH: "true"
  NAPGRAM_DOCKERHUB_PUBLISH: "true"
  NAPGRAM_DOCKER_USE_DEPENDENCY_PROXY: "false"

  NAPGRAM_DOCKER_IMAGE: "docker:29-cli"
  NAPGRAM_DOCKER_DIND_IMAGE: "docker:29-dind"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

.napgram_ci_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH =~ /^renovate\// || $CI_COMMIT_BRANCH == "chore/dependency-force-update")'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

.napgram_docker_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$NAPGRAM_DOCKER_PUBLISH != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - when: never

.napgram_docker_dev_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$NAPGRAM_DOCKER_PUBLISH != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

.napgram_docker_release_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .renovate\/.+ into /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .chore\/dependency-force-update into /'
      when: never
    - if: '$NAPGRAM_DOCKER_PUBLISH != "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - when: never

.napgram_bun:
  image: "$NAPGRAM_BUN_IMAGE"
  cache:
    key:
      files:
        - package.json
        - bun.lock
      prefix: "napgram-bun-1.4"
    paths:
      - .bun-cache/
    policy: pull
  before_script:
    - |
      set -eu
      if [ "${MAGISK_LINUX_USE_MIRROR:-true}" = "true" ]; then
        sed -i 's#https://dl-cdn.alpinelinux.org/alpine#https://mirrors.tuna.tsinghua.edu.cn/alpine#g' /etc/apk/repositories
      else
        sed -i 's#https://mirrors.tuna.tsinghua.edu.cn/alpine#https://dl-cdn.alpinelinux.org/alpine#g' /etc/apk/repositories
      fi
      apk add --no-cache bash git ca-certificates curl
      export BUN_REGISTRY="${BUN_CONFIG_REGISTRY:-https://registry.npmmirror.com}"
      export BUN_CONFIG_REGISTRY="$BUN_REGISTRY"
      export BUN_INSTALL_CACHE_DIR="$CI_PROJECT_DIR/.bun-cache"
      toolkit_dir="$(bash scripts/resolve_ci_toolkit.sh)"
      bash "$toolkit_dir/ci/ensure_bun.sh"
      bun --version

.napgram_docker:
  image: "$NAPGRAM_DOCKER_IMAGE"
  retry:
    max: 1
    when:
      - runner_system_failure
      - api_failure
      - script_failure
  services:
    - name: "$NAPGRAM_DOCKER_DIND_IMAGE"
      # Enable the containerd image store so the built-in driver can export registry caches.
      command: ["--tls=false", "--mtu=1400", "--feature", "containerd-snapshotter=true"]
  variables:
    HTTP_PROXY: "$CI_HTTP_PROXY"
    HTTPS_PROXY: "$CI_HTTPS_PROXY"
    http_proxy: "$CI_HTTP_PROXY"
    https_proxy: "$CI_HTTPS_PROXY"
    # Dependency Proxy redirects blobs to object storage; those hosts must use the proxy.
    NO_PROXY: "docker,docker:2375,docker:2376,gitlab.com,.gitlab.com,localhost,127.0.0.1"
    no_proxy: "docker,docker:2375,docker:2376,gitlab.com,.gitlab.com,localhost,127.0.0.1"
  before_script:
    - |
      use_mirror="${MAGISK_LINUX_USE_MIRROR:-true}"
      if [ "$use_mirror" = "true" ]; then
        sed -i 's#https://dl-cdn.alpinelinux.org/alpine#https://mirrors.tuna.tsinghua.edu.cn/alpine#g' /etc/apk/repositories 2>/dev/null || true
      fi
      for attempt in 1 2 3; do
        if apk add --no-cache bash curl git; then
          break
        fi
        if [ "$attempt" -eq 3 ]; then
          exit 1
        fi
        sed -i 's#https://mirrors.tuna.tsinghua.edu.cn/alpine#https://dl-cdn.alpinelinux.org/alpine#g' /etc/apk/repositories 2>/dev/null || true
        sleep "$((attempt * 5))"
      done
    - |
      set -euo pipefail
      if [ -n "${HTTP_PROXY:-${http_proxy:-}}" ] || [ -n "${HTTPS_PROXY:-${https_proxy:-}}" ]; then
        mkdir -p "$HOME/.docker"
        cat > "$HOME/.docker/config.json" <<EOF
      {
        "proxies": {
          "default": {
            "httpProxy": "${HTTP_PROXY:-${http_proxy:-}}",
            "httpsProxy": "${HTTPS_PROXY:-${https_proxy:-}}",
            "noProxy": "${NO_PROXY:-${no_proxy:-}}"
          }
        }
      }
      EOF
      fi
    - |
      set -euo pipefail
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo "Docker daemon did not become ready" >&2
          exit 1
        fi
        sleep 1
      done
      docker version
      docker buildx version

app:dependencies:
  extends:
    - .napgram_bun
    - .napgram_ci_rules
  stage: prepare
  cache:
    policy: pull-push
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - script_failure
  script:
    - bun install --frozen-lockfile --cache-dir "$BUN_INSTALL_CACHE_DIR" --registry "$BUN_REGISTRY"

ui:build:
  extends:
    - .napgram_bun
    - .napgram_docker_rules
  stage: build
  cache:
    key: "napgram-ui-bun-1.4"
    paths:
      - .bun-cache/
    policy: pull-push
  script:
    - |
      set -euo pipefail
      toolkit_dir="$(bash scripts/resolve_ci_toolkit.sh)"
      ui_ref="$NAPGRAM_UI_REF"
      if [ -n "${CI_COMMIT_TAG:-}" ] && [ -n "${NAPGRAM_UI_RELEASE_REF:-}" ]; then
        ui_ref="$NAPGRAM_UI_RELEASE_REF"
      fi

      auth_key=""
      cleanup_ui_auth() {
        if [ -n "$auth_key" ]; then
          git config --global --unset-all "$auth_key" || true
        fi
      }
      trap cleanup_ui_auth EXIT
      if [ -n "${UI_SRC_TOKEN:-}" ]; then
        if [[ "$NAPGRAM_UI_REPOSITORY" != https://* ]]; then
          echo "UI_SRC_TOKEN requires an HTTPS UI repository URL" >&2
          exit 2
        fi
        auth_key="http.${NAPGRAM_UI_REPOSITORY}.extraHeader"
        auth_value="$(printf '%s' "${UI_SRC_USERNAME:-oauth2}:$UI_SRC_TOKEN" | base64 | tr -d '\n')"
        git config --global "$auth_key" "Authorization: Basic $auth_value"
        unset auth_value
      fi

      "$toolkit_dir/ci/resolve_git_checkout.sh" \
        "$NAPGRAM_UI_REPOSITORY" \
        "$ui_ref" \
        "$CI_PROJECT_DIR/web"
      cleanup_ui_auth
      trap - EXIT

      cd "$CI_PROJECT_DIR/web"
      if [ -x "$toolkit_dir/ci/frontend_build.sh" ]; then
        MAGISK_FRONTEND_DIR="$CI_PROJECT_DIR/web" \
          MAGISK_FRONTEND_PACKAGE_JSON="$CI_PROJECT_DIR/web/package.json" \
          MAGISK_FRONTEND_BUILD_COMMAND="bun run build" \
          MAGISK_FRONTEND_DIST_DIR="$CI_PROJECT_DIR/web/dist" \
          bash "$toolkit_dir/ci/frontend_build.sh"
      else
        bun install --frozen-lockfile --cache-dir "$BUN_INSTALL_CACHE_DIR" --registry "$BUN_REGISTRY"
        bun run build
      fi
      test -n "$(find dist -type f -print -quit)"
  artifacts:
    name: "NapGram-ui-$CI_COMMIT_REF_SLUG"
    expire_in: 2 days
    paths:
      - web/dist/

app:typecheck:
  extends:
    - .napgram_bun
    - .napgram_ci_rules
  stage: validate
  needs:
    - job: app:dependencies
      artifacts: false
  script:
    - bun install --frozen-lockfile --cache-dir "$BUN_INSTALL_CACHE_DIR" --registry "$BUN_REGISTRY"
    - bun run --filter './packages/**' build
    - cd main
    - bun run type-check
    - bun run build
    - bun run check:bundle

app:test:coverage:
  extends:
    - .napgram_bun
    - .napgram_ci_rules
  stage: test
  needs:
    - job: app:dependencies
      artifacts: false
  services:
    - name: postgres:18-alpine
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: napgram_test
    PGUSER: postgres
    PGPASSWORD: postgres
    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: napgram_test
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/napgram_test"
    DATA_DIR: "$CI_PROJECT_DIR/.ci-data"
  script:
    - bun install --frozen-lockfile --cache-dir "$BUN_INSTALL_CACHE_DIR" --registry "$BUN_REGISTRY"
    - bun run --filter './packages/**' build
    - bash main/tools/run-drizzle-migrations.sh
    - mkdir -p "$DATA_DIR/temp" "$DATA_DIR/cache" "$DATA_DIR/logs"
    - cd main
    - bun run test:coverage:ci

app:lint:
  extends:
    - .napgram_bun
    - .napgram_ci_rules
  stage: quality
  needs:
    - job: app:dependencies
      artifacts: false
  allow_failure: true
  script:
    - bun install --frozen-lockfile --cache-dir "$BUN_INSTALL_CACHE_DIR" --registry "$BUN_REGISTRY"
    - cd main
    - bun run lint

security:gitleaks:
  extends: .napgram_ci_rules
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.28.0
    entrypoint: [""]
  stage: quality
  needs: []
  script:
    - gitleaks detect --source . --redact --no-banner

container:dev:amd64:
  extends:
    - .napgram_docker
    - .napgram_docker_dev_rules
  resource_group: napgram-docker-amd64
  stage: package
  tags:
    - $NAPGRAM_GITLAB_LINUX_AMD64_RUNNER_TAG
  needs:
    - job: ui:build
      artifacts: true
    - job: app:typecheck
      artifacts: false
    - job: app:test:coverage
      artifacts: false
    - job: security:gitleaks
      artifacts: false
  script:
    - bash scripts/ci/gitlab_docker.sh build-arch amd64

