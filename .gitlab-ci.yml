include:
  - project: magisk3171/magisk-ci-toolkit
    ref: ad6caa88fdb7bb395fb935a6ff261134103d6dd6
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: ad6caa88fdb7bb395fb935a6ff261134103d6dd6
    file: /.gitlab/ci/renovate.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - $NAPGRAM_GITLAB_DEFAULT_RUNNER_TAG
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure

stages:
  - prepare
  - build
  - validate
  - test
  - quality
  - package
  - release-build
  - release-publish
  - notify
  - maintenance

variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fast
  MAGISK_CI_TOOLKIT_REF: "ad6caa88fdb7bb395fb935a6ff261134103d6dd6"

  NAPGRAM_GITLAB_DEFAULT_RUNNER_TAG: "magisk-linux"
  NAPGRAM_GITLAB_LINUX_AMD64_RUNNER_TAG: "magisk-amd64-linux"
  NAPGRAM_GITLAB_LINUX_ARM64_RUNNER_TAG: "magisk-arm64-linux"
  NAPGRAM_NODE_IMAGE: "node:26-bookworm"

  # Override this when the UI mirror uses another namespace or host.
  NAPGRAM_UI_REPOSITORY: "https://gitlab.com/magisk3171/napgram-ui-dist.git"
  NAPGRAM_UI_REF: "dev"
  NAPGRAM_UI_RELEASE_REF: ""
  NAPGRAM_DOCKER_PUBLISH: "true"
  NAPGRAM_DOCKERHUB_PUBLISH: "true"
  NAPGRAM_DOCKER_USE_MIRROR: "false"
  NAPGRAM_DOCKER_USE_DEPENDENCY_PROXY: "false"

  NAPGRAM_DOCKER_IMAGE: "docker:29-cli"
  NAPGRAM_DOCKER_DIND_IMAGE: "docker:29-dind"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

.napgram_ci_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH =~ /^renovate\// || $CI_COMMIT_BRANCH == "chore/dependency-force-update")'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\// || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "chore/dependency-force-update")'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

.napgram_docker_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$NAPGRAM_DOCKER_PUBLISH != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - when: never

.napgram_docker_dev_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$NAPGRAM_DOCKER_PUBLISH != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

.napgram_docker_release_rules:
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .renovate\/.+ into /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .chore\/dependency-force-update into /'
      when: never
    - if: '$NAPGRAM_DOCKER_PUBLISH != "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
    - when: never

.napgram_node:
  image: "$NAPGRAM_NODE_IMAGE"
  cache:
    key:
      files:
        - package.json
        - pnpm-lock.yaml
      prefix: "napgram-node-26"
    paths:
      - .pnpm-store/
    policy: pull
  before_script:
    - |
      set -euo pipefail
      toolkit_dir="$(bash scripts/resolve_ci_toolkit.sh)"
      bash "$toolkit_dir/ci/ensure_pnpm.sh"
      pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
      pnpm --version

.napgram_docker:
  image: "$NAPGRAM_DOCKER_IMAGE"
  retry:
    max: 1
    when:
      - runner_system_failure
      - api_failure
      - script_failure
  services:
    - name: "$NAPGRAM_DOCKER_DIND_IMAGE"
      alias: docker
      # Enable the containerd image store so the built-in driver can export registry caches.
      command: ["--tls=false", "--mtu=1400", "--feature", "containerd-snapshotter=true"]
  variables:
    HTTP_PROXY: "$CI_HTTP_PROXY"
    HTTPS_PROXY: "$CI_HTTPS_PROXY"
    http_proxy: "$CI_HTTP_PROXY"
    https_proxy: "$CI_HTTPS_PROXY"
    # Dependency Proxy redirects blobs to object storage; those hosts must use the proxy.
    NO_PROXY: "docker,docker:2375,docker:2376,gitlab.com,.gitlab.com,localhost,127.0.0.1"
    no_proxy: "docker,docker:2375,docker:2376,gitlab.com,.gitlab.com,localhost,127.0.0.1"
  before_script:
    - |
      for attempt in 1 2 3; do
        if apk add --no-cache bash curl git; then
          break
        fi
        if [ "$attempt" -eq 3 ]; then
          exit 1
        fi
        sleep "$((attempt * 5))"
      done
    - |
      set -euo pipefail
      if [ -n "${HTTP_PROXY:-${http_proxy:-}}" ] || [ -n "${HTTPS_PROXY:-${https_proxy:-}}" ]; then
        mkdir -p "$HOME/.docker"
        cat > "$HOME/.docker/config.json" <<EOF
      {
        "proxies": {
          "default": {
            "httpProxy": "${HTTP_PROXY:-${http_proxy:-}}",
            "httpsProxy": "${HTTPS_PROXY:-${https_proxy:-}}",
            "noProxy": "${NO_PROXY:-${no_proxy:-}}"
          }
        }
      }
      EOF
      fi
    - |
      set -euo pipefail
      for attempt in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo "Docker daemon did not become ready" >&2
          exit 1
        fi
        sleep 1
      done
      docker version
      docker buildx version

app:dependencies:
  extends:
    - .napgram_node
    - .napgram_ci_rules
  stage: prepare
  cache:
    policy: pull-push
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - script_failure
  script:
    - pnpm install --frozen-lockfile

ui:build:
  extends:
    - .napgram_node
    - .napgram_docker_rules
  stage: build
  cache:
    key: "napgram-ui-node-26"
    paths:
      - .pnpm-store/
    policy: pull-push
  script:
    - |
      set -euo pipefail
      toolkit_dir="$(bash scripts/resolve_ci_toolkit.sh)"
      ui_ref="$NAPGRAM_UI_REF"
      if [ -n "${CI_COMMIT_TAG:-}" ] && [ -n "${NAPGRAM_UI_RELEASE_REF:-}" ]; then
        ui_ref="$NAPGRAM_UI_RELEASE_REF"
      fi

      auth_key=""
      cleanup_ui_auth() {
        if [ -n "$auth_key" ]; then
          git config --global --unset-all "$auth_key" || true
        fi
      }
      trap cleanup_ui_auth EXIT
      if [ -n "${UI_SRC_TOKEN:-}" ]; then
        if [[ "$NAPGRAM_UI_REPOSITORY" != https://* ]]; then
          echo "UI_SRC_TOKEN requires an HTTPS UI repository URL" >&2
          exit 2
        fi
        auth_key="http.${NAPGRAM_UI_REPOSITORY}.extraHeader"
        auth_value="$(printf '%s' "${UI_SRC_USERNAME:-oauth2}:$UI_SRC_TOKEN" | base64 | tr -d '\n')"
        git config --global "$auth_key" "Authorization: Basic $auth_value"
        unset auth_value
      fi

      "$toolkit_dir/ci/resolve_git_checkout.sh" \
        "$NAPGRAM_UI_REPOSITORY" \
        "$ui_ref" \
        "$CI_PROJECT_DIR/web"
      cleanup_ui_auth
      trap - EXIT

      cd "$CI_PROJECT_DIR/web"
      # Follow the UI repo's own packageManager pin when it declares one;
      # otherwise fall back to whatever pnpm the image already provides.
      if grep -q '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' package.json; then
        bash "$toolkit_dir/ci/ensure_pnpm.sh"
      fi
      pnpm install --frozen-lockfile
      pnpm run build
      test -n "$(find dist -type f -print -quit)"
  artifacts:
    name: "NapGram-ui-$CI_COMMIT_REF_SLUG"
    expire_in: 2 days
    paths:
      - web/dist/

app:typecheck:
  extends:
    - .napgram_node
    - .napgram_ci_rules
  stage: validate
  needs:
    - job: app:dependencies
      artifacts: false
  script:
    - pnpm install --frozen-lockfile
    - pnpm -r --filter "./packages/**" run build
    - pnpm --filter @napgram/app type-check
    - pnpm --filter @napgram/app build
    - pnpm --filter @napgram/app check:bundle

app:test:coverage:
  extends:
    - .napgram_node
    - .napgram_ci_rules
  stage: test
  needs:
    - job: app:dependencies
      artifacts: false
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: napgram_test
    PGUSER: postgres
    PGPASSWORD: postgres
    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: napgram_test
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/napgram_test"
    DATA_DIR: "$CI_PROJECT_DIR/.ci-data"
  script:
    - pnpm install --frozen-lockfile
    - pnpm -r --filter "./packages/**" run build
    - bash main/tools/run-drizzle-migrations.sh
    - mkdir -p "$DATA_DIR/temp" "$DATA_DIR/cache" "$DATA_DIR/logs"
    - pnpm --filter @napgram/app test:coverage:ci
  artifacts:
    name: "NapGram-coverage-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - main/coverage/

app:lint:
  extends:
    - .napgram_node
    - .napgram_ci_rules
  stage: quality
  needs:
    - job: app:dependencies
      artifacts: false
  allow_failure: true
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @napgram/app lint

security:gitleaks:
  extends: .napgram_ci_rules
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.28.0
    entrypoint: [""]
  stage: quality
  needs: []
  script:
    - gitleaks detect --source . --redact --no-banner

container:dev:amd64:
  extends:
    - .napgram_docker
    - .napgram_docker_dev_rules
  resource_group: napgram-docker-amd64
  stage: package
  tags:
    - $NAPGRAM_GITLAB_LINUX_AMD64_RUNNER_TAG
  needs:
    - job: ui:build
      artifacts: true
    - job: app:typecheck
      artifacts: false
    - job: app:test:coverage
      artifacts: false
    - job: security:gitleaks
      artifacts: false
  script:
    - bash scripts/ci/gitlab_docker.sh build-arch amd64

container:dev:arm64:
  extends:
    - .napgram_docker
    - .napgram_docker_dev_rules
  resource_group: napgram-docker-arm64
  stage: package
  tags:
    - $NAPGRAM_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: ui:build
      artifacts: true
    - job: app:typecheck
      artifacts: false
    - job: app:test:coverage
      artifacts: false
    - job: security:gitleaks
      artifacts: false
  script:
    - bash scripts/ci/gitlab_docker.sh build-arch arm64

container:dev:manifest:
  extends:
    - .napgram_docker
    - .napgram_docker_dev_rules
  resource_group: napgram-docker-manifest
  stage: release-publish
  needs:
    - job: container:dev:amd64
      artifacts: false
    - job: container:dev:arm64
      artifacts: false
  script:
    - bash scripts/ci/gitlab_docker.sh publish-manifests
  artifacts:
    reports:
      dotenv: telegram_images.env
    paths:
      - telegram_images.env
    expire_in: 1 day

container:release:amd64:
  extends:
    - .napgram_docker
    - .napgram_docker_release_rules
  resource_group: napgram-docker-amd64
  stage: release-build
  tags:
    - $NAPGRAM_GITLAB_LINUX_AMD64_RUNNER_TAG
  needs:
    - job: ui:build
      artifacts: true
    - job: app:typecheck
      artifacts: false
    - job: app:test:coverage
      artifacts: false
    - job: security:gitleaks
      artifacts: false
  script:
    - bash scripts/ci/gitlab_docker.sh build-arch amd64

container:release:arm64:
  extends:
    - .napgram_docker
    - .napgram_docker_release_rules
  resource_group: napgram-docker-arm64
  stage: release-build
  tags:
    - $NAPGRAM_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: ui:build
      artifacts: true
    - job: app:typecheck
      artifacts: false
    - job: app:test:coverage
      artifacts: false
    - job: security:gitleaks
      artifacts: false
  script:
    - bash scripts/ci/gitlab_docker.sh build-arch arm64

container:release:manifest:
  extends:
    - .napgram_docker
    - .napgram_docker_release_rules
  resource_group: napgram-docker-manifest
  stage: release-publish
  needs:
    - job: container:release:amd64
      artifacts: false
    - job: container:release:arm64
      artifacts: false
  script:
    - bash scripts/ci/gitlab_docker.sh publish-manifests
  artifacts:
    reports:
      dotenv: telegram_images.env
    paths:
      - telegram_images.env
    expire_in: 1 day

telegram:images:dev:
  extends:
    - .magisk_telegram_images
    - .napgram_docker_dev_rules
  stage: notify
  allow_failure: true
  tags:
    - magisk-arm64-linux
  needs:
    - job: container:dev:manifest
      artifacts: true
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "#NapGram"
    MAGISK_TELEGRAM_PROJECT_NAME: "NapGram"
    MAGISK_TELEGRAM_CI_BRANCH: "beta"
    MAGISK_TELEGRAM_IMAGE_EVENT: "docker-dev"
    MAGISK_TELEGRAM_PLATFORMS: "linux/amd64,linux/arm64"
    MAGISK_TELEGRAM_IMAGE_LIST_COMMAND: "scripts/ci/gitlab_docker.sh list-images"

telegram:images:release:
  extends: .magisk_telegram_images
  stage: notify
  allow_failure: true
  tags:
    - magisk-arm64-linux
  needs:
    - job: container:release:manifest
      artifacts: true
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$NAPGRAM_DOCKER_PUBLISH != "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/'
      when: on_success
    - when: never
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "#NapGram"
    MAGISK_TELEGRAM_PROJECT_NAME: "NapGram"
    MAGISK_TELEGRAM_IMAGE_EVENT: "docker-release"
    MAGISK_TELEGRAM_PLATFORMS: "linux/amd64,linux/arm64"
    MAGISK_TELEGRAM_IMAGE_LIST_COMMAND: "scripts/ci/gitlab_docker.sh list-images"

telegram:release:
  extends: .magisk_telegram_release
  stage: notify
  allow_failure: true
  tags:
    - magisk-arm64-linux
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "#NapGram"
    MAGISK_TELEGRAM_PROJECT_NAME: "NapGram"
    MAGISK_TELEGRAM_RELEASE_ARTIFACT_PATTERN: "*.napgram-no-artifact"
  needs:
    - job: container:release:manifest
      artifacts: false
      optional: true

renovate:gitlab:
  extends: .magisk_renovate_gitlab
  interruptible: false
  stage: maintenance
  tags:
    - magisk-arm64-linux
  variables:
    MAGISK_RENOVATE_REPOSITORY: "magisk3171/NapGram"

dependency-force:gitlab:
  extends:
    - .napgram_node
  interruptible: false
  stage: maintenance
  needs: []
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
    - when: never
  variables:
    DEPENDENCY_FORCE_HISTORICAL_ALERT_COOLDOWN_HOURS: "168"
    DEPENDENCY_FORCE_BRANCH: "chore/dependency-force-update"
    DEPENDENCY_FORCE_BASE: "beta"
    # GitHub Dependabot alerts mirror; falls back to [] when unavailable.
    DEPENDENCY_FORCE_GITHUB_REPO: "NapGram/NapGram"
  script:
    - bash scripts/ci/dependency_force_gitlab.sh
