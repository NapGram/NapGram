  extends: .magisk_telegram_release
  stage: notify
  allow_failure: true
  tags:
    - magisk-arm64-linux
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "#NapGram"
    MAGISK_TELEGRAM_PROJECT_NAME: "NapGram"
    MAGISK_TELEGRAM_RELEASE_ARTIFACT_PATTERN: "*.napgram-no-artifact"
  needs:
    - job: container:release:manifest
      artifacts: false
      optional: true

renovate:gitlab:
  extends: .magisk_renovate_gitlab
  interruptible: true
  stage: maintenance
  tags:
    - magisk-arm64-linux
  variables:
    MAGISK_RENOVATE_REPOSITORY: "magisk3171/napgram-ecosystem/NapGram"
    MAGISK_RENOVATE_PLATFORM_AUTOMERGE: "false"
    MAGISK_RENOVATE_IGNORE_TESTS: "true"

dependency-force:gitlab:
  extends:
    - .napgram_bun
  interruptible: false
  stage: maintenance
  needs: []
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
    - when: never
  variables:
    DEPENDENCY_FORCE_HISTORICAL_ALERT_COOLDOWN_HOURS: "168"
    DEPENDENCY_FORCE_BRANCH: "chore/dependency-force-update"
    DEPENDENCY_FORCE_BASE: "beta"
    # GitHub Dependabot alerts mirror; falls back to [] when unavailable.
    DEPENDENCY_FORCE_GITHUB_REPO: "NapGram/NapGram"
  script:
    - bash scripts/ci/dependency_force_gitlab.sh

# Publish @napgram/sdk (+sdk-core, sdk-utils) to the GitLab project npm registry.
# Triggered by version tags when GitLab owns the release (RELEASE_OWNER=gitlab).
# Bun resolves workspace:* protocol to concrete versions at publish time.
sdk:publish:
  extends: .napgram_bun
  interruptible: false
  stage: release-publish
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+.*$/ && $RELEASE_OWNER == "gitlab"'
      when: on_success
    - when: never
  script:
    - bun install --frozen-lockfile --cache-dir "$BUN_INSTALL_CACHE_DIR" --registry "$BUN_REGISTRY"
    - |
      REGISTRY="https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
      AUTH_TOKEN="${SDK_PUBLISH_TOKEN:-$CI_JOB_TOKEN}"
      printf '%s\n%s\n%s\n' \
        "registry=${REGISTRY}" \
        "${REGISTRY#https:}:_authToken=${AUTH_TOKEN}" \
        "always-auth=true" > "$HOME/.npmrc"
    - bun run --filter '@napgram/sdk-core' build
    - bun run --filter '@napgram/sdk-utils' build
    - bun run --filter '@napgram/sdk' build
    # Publish is skipped entirely when SDK_PUBLISH_TOKEN is unset (build-only).
    # The previous GitHub flow used changesets: a "Version Packages" PR had to
    # be manually merged before publish — setting SDK_PUBLISH_TOKEN is the
    # GitLab-side equivalent of that manual confirmation.
    - |
      if [ -z "${SDK_PUBLISH_TOKEN:-}" ]; then
        echo "SDK_PUBLISH_TOKEN unset; built sdk packages but skipping publish."
        exit 0
      fi
    # Publish order: sdk-core (no deps) -> sdk-utils (deps on core) -> sdk.
    # Bun rewrites workspace:* to concrete versions. Publish is idempotent:
    # a version already on the registry is ignored so re-triggering the tag
    # pipeline does not fail the job.
    - |
      publish_pkg() {
        package_name="$1"
        package_dir="${package_name#@napgram/}"
        cd "$CI_PROJECT_DIR/packages/$package_dir"
        if bun publish --tolerate-republish --registry "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" 2>&1 | tee /tmp/publish.log; then
          return 0
        fi
        if grep -qiE 'cannot publish over|already exist|EPUBLISHCONFLICT|"code":"E403"' /tmp/publish.log; then
          echo "Version already published; skipping $1"
          return 0
        fi
        return 1
      }
    - publish_pkg "@napgram/sdk-core"
    - publish_pkg "@napgram/sdk-utils"
    - publish_pkg "@napgram/sdk"
cancel:older:mr:pipelines:
  extends: .magisk_cancel_older_mr_pipelines
