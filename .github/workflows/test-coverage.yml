name: Test Coverage

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env: {}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: napgram_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2


      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set Bun cache directory
        id: bun-cache
        shell: bash
        run: |
          echo "CACHE_PATH=${RUNNER_TEMP}/bun-cache" >> "$GITHUB_OUTPUT"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.bun-cache.outputs.CACHE_PATH }}
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: BUN_INSTALL_CACHE_DIR="${RUNNER_TEMP}/bun-cache" bun install --frozen-lockfile

      - name: Build @napgram packages
        run: bun run --filter './packages/**' build

      - name: Run Drizzle migrations
        run: bash ./main/tools/run-drizzle-migrations.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/napgram_test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: napgram_test

      - name: Prepare test environment
        run: |
          mkdir -p ${{ runner.temp }}/napgram-data/temp
          mkdir -p ${{ runner.temp }}/napgram-data/cache
          mkdir -p ${{ runner.temp }}/napgram-data/logs

      - name: Run tests with coverage
        run: cd main && bun run test:coverage:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/napgram_test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: napgram_test
          DATA_DIR: ${{ runner.temp }}/napgram-data

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./main/coverage/coverage-final.json
          flags: unittests
          name: codecov-napgram
          fail_ci_if_error: false
