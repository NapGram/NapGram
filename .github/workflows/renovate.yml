name: Renovate

on:
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday at midnight
  push:
    branches:
      - dev
  workflow_dispatch:
  issues:
    types:
      - edited
  pull_request_target:
    types:
      - edited
    branches:
      - dev

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    if: |
      (
        github.event_name != 'pull_request_target' &&
        github.event_name != 'issues'
      ) ||
      (
        github.event_name == 'push' &&
        github.ref_name == 'dev' &&
        github.event.head_commit != null &&
        startsWith(github.event.head_commit.message, 'Merge pull request #') &&
        (
          contains(github.event.head_commit.message, 'from NapGram/renovate/') ||
          contains(github.event.head_commit.message, 'from NapGram/chore/dependency-force-update')
        )
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == 'dev' &&
        github.event.pull_request.user.login == 'magisk317' &&
        startsWith(github.event.pull_request.head.ref, 'renovate/') &&
        github.event.changes.body != null &&
        contains(github.event.pull_request.body, '- [x] <!-- rebase-check -->') &&
        !contains(github.event.changes.body.from, '- [x] <!-- rebase-check -->')
      ) ||
      (
        github.event_name == 'issues' &&
        github.event.issue.title == 'Dependency Dashboard' &&
        github.event.changes.body != null &&
        contains(github.event.issue.body, 'This issue lists Renovate updates and detected dependencies.') &&
        (
          (
            contains(github.event.issue.body, '- [x] <!-- rebase-all-open-prs -->') &&
            !contains(github.event.changes.body.from, '- [x] <!-- rebase-all-open-prs -->')
          ) ||
          (
            contains(github.event.issue.body, '- [x] <!-- rebase-branch=') &&
            !contains(github.event.changes.body.from, '- [x] <!-- rebase-branch=')
          )
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.17
        with:
          configurationFile: .github/renovate-config.js
          token: ${{ secrets.GH_PAT }}

      - name: Cleanup orphan renovate branches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "Checking for orphan renovate branches..."

          # Configure git authentication
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          # List all remote branches starting with renovate/
          branches=$(git ls-remote --heads origin | awk '{print $2}' | grep 'refs/heads/renovate/' || true)

          if [[ -z "$branches" ]]; then
            echo "No renovate branches found."
            exit 0
          fi

          for branch in $branches; do
            branch_name=${branch#refs/heads/}
            echo "Checking branch: $branch_name"

            # Check if there is an open PR for this branch
            if ! gh pr list --head "$branch_name" --state open --json number --jq '.[].number' | grep -q .; then
              echo "Deleting orphan branch: $branch_name"
              git push origin --delete "$branch_name" || echo "Failed to delete $branch_name (may already be deleted)"
            else
              echo "Branch $branch_name has an open PR, skipping."
            fi
          done

          echo "Orphan branch cleanup completed."
