name: Dependency PR Auto Merge

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.base.ref == 'dev' &&
      (
        github.event.pull_request.user.login == 'github-actions[bot]' ||
        github.event.pull_request.user.login == 'renovate[bot]' ||
        github.event.pull_request.user.login == 'app/renovate' ||
        (
          github.event.pull_request.user.login == 'magisk317' &&
          (
            startsWith(github.head_ref, 'renovate/') ||
            startsWith(github.head_ref, 'dependabot/') ||
            startsWith(github.head_ref, 'janitor/') ||
            (
              github.head_ref == 'chore/dependency-force-update' &&
              github.event.pull_request.title == 'build: update forced dependencies'
            )
          )
        )
      )
    steps:
      - name: Enable auto-merge for dependency PRs
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh pr merge --auto --merge --delete-branch "$PR_URL"
