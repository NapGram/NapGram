name: Deploy UI to Cloudflare Pages

on:
  workflow_dispatch: # 手动从外部 UI 源码仓库拉取并发布

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Resolve UI checkout token
        id: ui-token
        env:
          UI_SRC_TOKEN: ${{ secrets.UI_SRC_TOKEN }}
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          set -euo pipefail

          ref="refs/heads/dev"

          for token in "$UI_SRC_TOKEN" "$SUBMODULE_TOKEN" "$GH_PAT" "$GH_PACKAGES_TOKEN" "$GITHUB_TOKEN_FALLBACK"; do
            if [ -z "${token:-}" ]; then
              continue
            fi
            echo "::add-mask::$token"
            if git ls-remote --exit-code "https://x-access-token:${token}@github.com/magisk317/napgram-ui-dist.git" "$ref" >/dev/null 2>&1; then
              echo "token=$token" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No usable token found for magisk317/napgram-ui-dist" >&2
          exit 1

      - name: Checkout napgram-ui-dist source
        uses: actions/checkout@v7
        with:
          repository: magisk317/napgram-ui-dist
          ref: dev
          token: ${{ steps.ui-token.outputs.token }}
          path: web

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install UI dependencies
        run: |
          cd web
          pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Build UI
        run: |
          cd web
          pnpm --ignore-workspace run build
        env:
          NODE_ENV: production
          VITE_API_ORIGIN: ${{ secrets.VITE_API_ORIGIN }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PAGES_PROJECT }}
          directory: ./web/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy summary
        run: |
          echo "✅ UI built from the external repo and uploaded to Cloudflare Pages"
