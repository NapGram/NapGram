name: Build and publish (release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (default: alpine)'
        required: false
        default: 'alpine'
        type: choice
        options:
          - alpine

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-alpine:
    name: Build Alpine multi-platform
    if: |
      github.event_name == 'release' || 
      github.event.inputs.variant == 'all' || 
      github.event.inputs.variant == 'alpine'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.UI_SRC_TOKEN || github.token }}


      - name: Derive build info
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Resolve CI toolkit
        run: bash scripts/resolve_ci_toolkit.sh >/dev/null

      - name: Derive Docker Hub target (optional)
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_ENABLED=1" >> "$GITHUB_ENV"
            if [ -n "${{ secrets.DOCKERHUB_IMAGE }}" ]; then
              echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_IMAGE }}" >> "$GITHUB_ENV"
            else
              echo "DOCKERHUB_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/napgram" >> "$GITHUB_ENV"
            fi
          else
            echo "DOCKERHUB_ENABLED=0" >> "$GITHUB_ENV"
            echo "DOCKERHUB_IMAGE=" >> "$GITHUB_ENV"
          fi

      - name: Resolve UI checkout token
        id: ui-token
        env:
          UI_SRC_TOKEN: ${{ secrets.UI_SRC_TOKEN }}
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          set -euo pipefail

          ref="refs/heads/dev"

          for token in "$UI_SRC_TOKEN" "$SUBMODULE_TOKEN" "$GH_PAT" "$GH_PACKAGES_TOKEN" "$GITHUB_TOKEN_FALLBACK"; do
            if [ -z "${token:-}" ]; then
              continue
            fi
            echo "::add-mask::$token"
            if git ls-remote --exit-code "https://x-access-token:${token}@github.com/magisk317/napgram-ui-dist.git" "$ref" >/dev/null 2>&1; then
              echo "token=$token" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No usable token found for magisk317/napgram-ui-dist" >&2
          exit 1

      - name: Download UI dist artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ steps.ui-token.outputs.token }}
          repo: magisk317/napgram-ui-dist
          branch: dev
          workflow: build.yml
          name: napgram-ui-dist
          path: web/dist


      - name: OCI meta (Alpine)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern=v{{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (Alpine)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=alpine
          cache-to: type=gha,mode=max,scope=alpine
          build-args: |
            REPO=${{ github.repository }}
            REF=${{ github.ref }}
            COMMIT=${{ env.BUILD_SHA }}
            USE_MIRROR=false
            NODE_VERSION=25-alpine${{ env.ALPINE_BRANCH }}

      - name: Publish Sentry release (optional)
        continue-on-error: true
        if: success()
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          BUILD_SHA: ${{ env.BUILD_SHA }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN not set, skip Sentry release publish."
            exit 0
          fi
          : "${SENTRY_ORG:=napgram}"
          : "${SENTRY_PROJECT:=napgram}"
          npm i -g @sentry/cli
          sentry-cli releases new "$BUILD_SHA"
          sentry-cli releases set-commits "$BUILD_SHA" --auto
          sentry-cli releases finalize "$BUILD_SHA"

      - name: Mirror images to Docker Hub (optional)
        id: dockerhub_mirror
        if: env.DOCKERHUB_ENABLED == '1' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        env:
          MAGISK_SOURCE_REGISTRY: ghcr.io
          MAGISK_SOURCE_USERNAME: ${{ github.actor }}
          MAGISK_SOURCE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          MAGISK_TARGET_REGISTRY: docker.io
          MAGISK_TARGET_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          MAGISK_TARGET_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          MAGISK_TARGET_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          MAGISK_SOURCE_IMAGE="${GHCR_TAGS%%:*}"
           MAGISK_CONTAINER_TAGS="$(sed '/^$/d; s/.*://' <<<"$GHCR_TAGS")"
           export MAGISK_SOURCE_IMAGE MAGISK_CONTAINER_TAGS
           bash .magisk-ci-toolkit/ci/container_mirror.sh mirror

      - name: Send Telegram Notification (Alpine)
        if: success()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DOCKERHUB_PUBLISH_OK: ${{ steps.dockerhub_mirror.outcome == 'success' }}
        run: |
          MAGISK_CONTAINER_TAGS="$(sed '/^$/d; s/.*://' <<<"$TAGS")"
          export MAGISK_CONTAINER_TAGS
          IMAGES="$(
            MAGISK_PRIMARY_IMAGE="${TAGS%%:*}" \
            MAGISK_OPTIONAL_IMAGE="$DOCKERHUB_IMAGE" \
            MAGISK_OPTIONAL_PUBLISHED="$DOCKERHUB_PUBLISH_OK" \
              bash .magisk-ci-toolkit/ci/container_mirror.sh list | sed 's/^/  - /'
          )"
          PROJECT_TAG="📌 #NapGram"
          MESSAGE="$(cat <<EOF
          ✅ NapGram：docker-release
          ${PROJECT_TAG}

          📦 Release: ${{ github.ref_name }}
          📚 Repo: ${{ github.repository }}
          🧩 Commit: ${{ env.BUILD_SHA }}
          🖥️ Base: Alpine Linux
          🐳 Platforms: linux/amd64, linux/arm64
          Images:
          ${IMAGES}
          🔗 Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"
          curl -fSs -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_TO_GROUP }}" \
            -d "message_thread_id=${{ secrets.TELEGRAM_TOPIC_ID }}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=$MESSAGE"
