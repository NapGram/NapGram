name: Build and publish (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_amd64:
    name: Build dev image (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BUILD_REF: refs/heads/dev
      BUILD_REF_NAME: dev

    outputs:
      pushed: ${{ steps.pushed.outputs.pushed }}
    steps:
      - name: Checkout (dev)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.UI_SRC_TOKEN || github.token }}


      - name: Derive build info
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Derive Docker Hub target (optional)
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_ENABLED=1" >> "$GITHUB_ENV"
            if [ -n "${{ secrets.DOCKERHUB_IMAGE }}" ]; then
              echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_IMAGE }}" >> "$GITHUB_ENV"
            else
              echo "DOCKERHUB_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/napgram" >> "$GITHUB_ENV"
            fi
          else
            echo "DOCKERHUB_ENABLED=0" >> "$GITHUB_ENV"
            echo "DOCKERHUB_IMAGE=" >> "$GITHUB_ENV"
          fi

      - name: Debug UI token access
        env:
          UI_SRC_TOKEN: ${{ secrets.UI_SRC_TOKEN }}
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          set -euo pipefail

          test_token() {
            name="$1"
            token="$2"

            if [ -z "${token:-}" ]; then
              echo "$name empty"
              return
            fi

            echo "::add-mask::$token"
            len=$(printf %s "$token" | wc -c | tr -d ' ')
            fp=$(printf %s "$token" | sha256sum | awk '{print $1}' | cut -c1-12)
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              https://api.github.com/repos/magisk317/napgram-ui-dist)

            if git ls-remote --exit-code "https://x-access-token:${token}@github.com/magisk317/napgram-ui-dist.git" refs/heads/dev >/dev/null 2>&1; then
              git_ok=yes
            else
              git_ok=no
            fi

            echo "$name len=$len fp=$fp api=$code git=$git_ok"
          }

          test_token UI_SRC_TOKEN "$UI_SRC_TOKEN"
          test_token SUBMODULE_TOKEN "$SUBMODULE_TOKEN"
          test_token GH_PAT "$GH_PAT"
          test_token GH_PACKAGES_TOKEN "$GH_PACKAGES_TOKEN"
          test_token GITHUB_TOKEN_FALLBACK "$GITHUB_TOKEN_FALLBACK"

      - name: Resolve UI checkout token
        id: ui-token
        env:
          UI_SRC_TOKEN: ${{ secrets.UI_SRC_TOKEN }}
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          set -euo pipefail

          repo_url="https://github.com/magisk317/napgram-ui-dist.git"
          ref="refs/heads/dev"

          for token in "$UI_SRC_TOKEN" "$SUBMODULE_TOKEN" "$GH_PAT" "$GH_PACKAGES_TOKEN" "$GITHUB_TOKEN_FALLBACK"; do
            if [ -z "${token:-}" ]; then
              continue
            fi
            echo "::add-mask::$token"
            if git ls-remote --exit-code "https://x-access-token:${token}@github.com/magisk317/napgram-ui-dist.git" "$ref" >/dev/null 2>&1; then
              echo "token=$token" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No usable token found for magisk317/napgram-ui-dist" >&2
          exit 1

      - name: Download UI dist artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ steps.ui-token.outputs.token }}
          repo: magisk317/napgram-ui-dist
          branch: dev
          workflow: build.yml
          name: napgram-ui-dist
          path: web/dist

      - name: Prepare tag date
        run: echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"


      - name: OCI meta (arch)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=dev-latest
            type=raw,value=dev-${{ env.DATE }}
          flavor: |
            latest=false
            suffix=-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_ENABLED == '1' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=dev-amd64
          cache-to: type=gha,mode=max,scope=dev-amd64
          build-args: |
            REPO=${{ github.repository }}
            REF=${{ env.BUILD_REF }}
            COMMIT=${{ env.BUILD_SHA }}
            USE_MIRROR=false

      - name: Mark pushed
        if: success()
        id: pushed
        run: echo "pushed=1" >> "$GITHUB_OUTPUT"

  build_arm64_native:
    name: Build dev image (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      BUILD_REF: refs/heads/dev
      BUILD_REF_NAME: dev

    outputs:
      pushed: ${{ steps.pushed.outputs.pushed }}
    steps:
      - name: Checkout (dev)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.UI_SRC_TOKEN || github.token }}


      - name: Derive build info
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Derive Docker Hub target (optional)
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_ENABLED=1" >> "$GITHUB_ENV"
            if [ -n "${{ secrets.DOCKERHUB_IMAGE }}" ]; then
              echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_IMAGE }}" >> "$GITHUB_ENV"
            else
              echo "DOCKERHUB_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/napgram" >> "$GITHUB_ENV"
            fi
          else
            echo "DOCKERHUB_ENABLED=0" >> "$GITHUB_ENV"
            echo "DOCKERHUB_IMAGE=" >> "$GITHUB_ENV"
          fi

      - name: Debug UI token access
        env:
          UI_SRC_TOKEN: ${{ secrets.UI_SRC_TOKEN }}
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          set -euo pipefail

          test_token() {
            name="$1"
            token="$2"

            if [ -z "${token:-}" ]; then
              echo "$name empty"
              return
            fi

            echo "::add-mask::$token"
            len=$(printf %s "$token" | wc -c | tr -d ' ')
            fp=$(printf %s "$token" | sha256sum | awk '{print $1}' | cut -c1-12)
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              https://api.github.com/repos/magisk317/napgram-ui-dist)

            if git ls-remote --exit-code "https://x-access-token:${token}@github.com/magisk317/napgram-ui-dist.git" refs/heads/dev >/dev/null 2>&1; then
              git_ok=yes
            else
              git_ok=no
            fi

            echo "$name len=$len fp=$fp api=$code git=$git_ok"
          }

          test_token UI_SRC_TOKEN "$UI_SRC_TOKEN"
          test_token SUBMODULE_TOKEN "$SUBMODULE_TOKEN"
          test_token GH_PAT "$GH_PAT"
          test_token GH_PACKAGES_TOKEN "$GH_PACKAGES_TOKEN"
          test_token GITHUB_TOKEN_FALLBACK "$GITHUB_TOKEN_FALLBACK"

      - name: Resolve UI checkout token
        id: ui-token
        env:
          UI_SRC_TOKEN: ${{ secrets.UI_SRC_TOKEN }}
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          set -euo pipefail

          repo_url="https://github.com/magisk317/napgram-ui-dist.git"
          ref="refs/heads/dev"

          for token in "$UI_SRC_TOKEN" "$SUBMODULE_TOKEN" "$GH_PAT" "$GH_PACKAGES_TOKEN" "$GITHUB_TOKEN_FALLBACK"; do
            if [ -z "${token:-}" ]; then
              continue
            fi
            echo "::add-mask::$token"
            if git ls-remote --exit-code "https://x-access-token:${token}@github.com/magisk317/napgram-ui-dist.git" "$ref" >/dev/null 2>&1; then
              echo "token=$token" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No usable token found for magisk317/napgram-ui-dist" >&2
          exit 1

      - name: Download UI dist artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ steps.ui-token.outputs.token }}
          repo: magisk317/napgram-ui-dist
          branch: dev
          workflow: build.yml
          name: napgram-ui-dist
          path: web/dist

      - name: Prepare tag date
        run: echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"


      - name: OCI meta (arch)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=dev-latest
            type=raw,value=dev-${{ env.DATE }}
          flavor: |
            latest=false
            suffix=-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_ENABLED == '1' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (arm64 native)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha,scope=dev-arm64
          cache-to: type=gha,mode=max,scope=dev-arm64
          build-args: |
            REPO=${{ github.repository }}
            REF=${{ env.BUILD_REF }}
            COMMIT=${{ env.BUILD_SHA }}
            USE_MIRROR=false

      - name: Mark pushed
        if: success()
        id: pushed
        run: echo "pushed=1" >> "$GITHUB_OUTPUT"

  manifest:
    name: Publish multi-arch manifests
    runs-on: ubuntu-latest
    needs:
      - build_amd64
      - build_arm64_native
    if: always() && github.actor != 'dependabot[bot]' && needs.build_amd64.result == 'success' && needs.build_arm64_native.result == 'success'
    permissions:
      contents: read
      packages: write
    env:
      BUILD_REF: refs/heads/dev
      BUILD_REF_NAME: dev
    steps:
      - name: Checkout (dev)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.UI_SRC_TOKEN || github.token }}

      - name: Derive build info
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Derive Docker Hub target (optional)
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_ENABLED=1" >> "$GITHUB_ENV"
            if [ -n "${{ secrets.DOCKERHUB_IMAGE }}" ]; then
              echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_IMAGE }}" >> "$GITHUB_ENV"
            else
              echo "DOCKERHUB_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/napgram" >> "$GITHUB_ENV"
            fi
          else
            echo "DOCKERHUB_ENABLED=0" >> "$GITHUB_ENV"
            echo "DOCKERHUB_IMAGE=" >> "$GITHUB_ENV"
          fi

      - name: Prepare tag date
        run: echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: OCI meta (manifest)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=dev-latest
            type=raw,value=dev-${{ env.DATE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_ENABLED == '1' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        if: github.actor != 'dependabot[bot]'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create \
              --tag "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
          done

      - name: Set up Node.js for sentry-cli
        if: success()
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Publish Sentry release (optional)
        continue-on-error: true
        if: success()
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          BUILD_SHA: ${{ env.BUILD_SHA }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN not set, skip Sentry release publish."
            exit 0
          fi
          : "${SENTRY_ORG:=napgram}"
          : "${SENTRY_PROJECT:=napgram}"
          npm i -g @sentry/cli
          sentry-cli releases new "$BUILD_SHA"
          sentry-cli releases set-commits "$BUILD_SHA" --auto
          sentry-cli releases finalize "$BUILD_SHA"

      - name: Send Telegram Notification on Success
        if: success()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGES="$(printf '%s\n' "$TAGS" | sed '/^$/d' | sed 's/^/  - /')"
          PROJECT_TAG="📌 #NapGram"
          MESSAGE="$(cat <<EOF
          ✅ NapGram：docker-dev
          ${PROJECT_TAG}

          📚 Repo: ${{ github.repository }}
          🌿 Ref: ${{ env.BUILD_REF_NAME }} @ ${{ env.BUILD_SHA }}
          🖥️ Base: Linux
          🐳 Platforms: linux/amd64, linux/arm64
          Images:
          ${IMAGES}
          🔗 Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"
          curl -fSs -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_TO_GROUP }}" \
            -d "message_thread_id=${{ secrets.TELEGRAM_TOPIC_ID }}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=$MESSAGE"
