# Monorepo workspace: the app (main) plus all @napgram/* packages live here.
packages:
  - 'main'
  - 'packages/sdk'
  - 'packages/sdk-core'
  - 'packages/sdk-utils'
  - 'packages/builtins'
  - 'packages/core/*'
  - 'packages/clients/*'
  - 'packages/utilities/*'
  - 'packages/plugins/**'
minimumReleaseAge: 0
allowBuilds:
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  silk-sdk: true
  skia-canvas: true
  ssh2: true

overrides:
  '@fastify/static': '10.1.2'
  '@vitest/mocker': '4.1.11'
  'baseline-browser-mapping': '2.11.0'
  'brace-expansion': '5.0.9'
  'browserslist': '4.28.7'
  'colord': '2.9.4'
  'esbuild': '0.28.1'
  'fast-uri': '3.1.6'
  'fastify': '5.12.1'
  'find-my-way': '9.7.0'
  'nanoid': '3.3.18'
  'postcss': '8.5.23'
  'vitest': '4.1.11'
