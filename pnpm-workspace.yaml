# Single-package workspace: retains pnpm workspace features (allowBuilds, overrides)
# while core logic lives in external @napgram/* packages.
packages:
  - 'main'
minimumReleaseAge: 0
allowBuilds:
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  silk-sdk: true
  skia-canvas: true
  ssh2: true

overrides:
  'esbuild': '0.28.0'
