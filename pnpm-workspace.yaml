# Monorepo workspace: the app (main) plus all @napgram/* packages live here.
packages:
  - 'main'
  - 'packages/sdk'
  - 'packages/sdk-core'
  - 'packages/sdk-utils'
  - 'packages/builtins'
  - 'packages/core/*'
  - 'packages/clients/*'
  - 'packages/utilities/*'
  - 'packages/plugins/**'
minimumReleaseAge: 0
allowBuilds:
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  silk-sdk: true
  skia-canvas: true
  ssh2: true

overrides:
  'esbuild': '0.28.1'
